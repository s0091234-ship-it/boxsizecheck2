<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>박스몰 사이즈 검색 | 가로·세로·높이로 딱 맞는 박스 찾기</title>
  <meta name="description" content="가로, 세로, 높이 중 하나만 입력해도 비슷한 사이즈의 택배·포장 박스를 바로 찾아드립니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="global-nav">
    <div class="nav-inner">
      <a href="#" class="logo"><img src="logo.png" alt="IGODA" /></a>
      <div class="nav-links">
        <a href="#search">사이즈 검색</a>
        <a href="#results">검색 결과</a>
      </div>
    </div>
  </nav>

  <header class="sub-nav">
    <div class="sub-inner">
      <span class="sub-title">사이즈 검색</span>
      <a href="#search" class="btn-primary btn-sm">박스 찾기</a>
    </div>
  </header>

  <main>
    <section class="tile tile-light hero">
      <h1>원하는 크기를<br />입력하세요.</h1>
      <p class="lead">가로·세로·높이 중 하나만 입력해도<br class="m" /> 가장 비슷한 박스를 찾아드립니다.</p>
      <div class="hero-box">
        <img src="hero-box.png" alt="골판지 택배 박스" />
      </div>
    </section>

    <section class="tile tile-dark" id="search">
      <h2 class="tile-head">사이즈 입력 <span class="unit">(mm, 외경 기준)</span></h2>
      <div class="name-row">
        <label class="field"><span>품명</span><input id="inName" type="search" placeholder="예) 2호, 우체국, 피자" autocomplete="off" /></label>
      </div>
      <form id="searchForm" class="search-form" autocomplete="off">
        <label class="field"><span>가로</span><input id="inW" type="number" min="0" inputmode="numeric" placeholder="예) 300" /></label>
        <span class="x">×</span>
        <label class="field"><span>세로</span><input id="inD" type="number" min="0" inputmode="numeric" placeholder="예) 200" /></label>
        <span class="x">×</span>
        <label class="field"><span>높이</span><input id="inH" type="number" min="0" inputmode="numeric" placeholder="예) 150" /></label>
      </form>

      <div class="options">
        <div class="opt">
          <span class="opt-label">오차 범위</span>
          <div class="chips" id="tolChips">
            <button type="button" class="chip" data-tol="10">±10mm</button>
            <button type="button" class="chip active" data-tol="30">±30mm</button>
            <button type="button" class="chip" data-tol="50">±50mm</button>
            <button type="button" class="chip" data-tol="100">±100mm</button>
          </div>
        </div>
        <label class="opt check"><input type="checkbox" id="rotate" checked /> 가로·세로 방향 무관 (회전 허용)</label>
      </div>

      <div class="actions">
        <button id="btnSearch" class="btn-primary">검색</button>
        <button id="btnReset" class="btn-ghost-dark">초기화</button>
      </div>
    </section>

    <section class="tile tile-parchment" id="results">
      <div class="results-head">
        <h2 class="tile-head" id="resultTitle">전체 상품</h2>
        <div class="results-tools">
          <select id="catFilter" class="select"></select>
          <select id="sortSel" class="select">
            <option value="match">유사도순</option>
            <option value="vol-asc">부피 작은순</option>
            <option value="vol-desc">부피 큰순</option>
            <option value="w-asc">가로 작은순</option>
          </select>
        </div>
      </div>
      <p class="count" id="count"></p>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <p class="tagline">조건에 맞는 박스가 없습니다.</p>
        <p>오차 범위를 넓혀보세요.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="foot-head">박스몰 사이즈 검색</p>
      <p>모든 사이즈는 외경(mm) 기준이며 실제 제품과 약간의 오차가 있을 수 있습니다.</p>
      <p class="legal">© 2026 BOXMALL. All rights reserved.</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
